<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 24px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd0d5;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 16px;
            padding: 12px 18px;
            border: none;
            background: #0078d4;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #005a9e;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Contáctanos</h1>
        <p>Complete el formulario para solicitar el contrato de servicios.</p>
        <form action="ContratoServicios.html" method="get">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono">

            <label for="mensaje">Mensaje o requerimiento</label>
            <textarea id="mensaje" name="mensaje" rows="5"></textarea>

            <button type="submit">Solicitar contrato de servicios</button>
        </form>
    </div>
</body>

</html>
